<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>School log</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="School">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF2F9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEF2F9; --surface:#FFFFFF; --ink:#1B2340; --muted:#6B7391; --line:#E1E6F0;
  --brand:#4F5BD5; --brand-tint:#E8EAFB;
  --alert:#E5484D; --alert-tint:#FDECEC; --warn:#E8870E; --warn-tint:#FFF3E2;
  --english:#3B6FE0; --hebrew:#E5484D; --math:#E8870E; --cinema:#8E4EC6; --cs:#12A594;
  --history:#C2622D; --civics:#5B7A2E; --literature:#D6409F; --bible:#9A6B3F; --sustainability:#30A46C;
  color-scheme:light;
}
:root[data-theme="dark"]{color-scheme:light}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:500 16px/1.45 Nunito,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;
  background-image:radial-gradient(circle,#D6DCEA 1px,transparent 1.2px);background-size:22px 22px;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:18px 16px 140px}
.tint{background:color-mix(in srgb,var(--c) 13%,white)}

/* header */
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 18px}
h1{font:700 2.4rem/1 Fredoka,Nunito,sans-serif;margin:0;color:var(--ink)}
.today{text-align:right;line-height:1.2}
#todayLbl{display:inline-block;white-space:nowrap;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.9rem;color:var(--brand)}
.sync{font-size:.78rem;color:var(--muted);margin-top:4px;cursor:pointer}

/* heads-up */
.heads{background:var(--surface);border-radius:20px;padding:14px 16px;margin-bottom:18px;box-shadow:0 2px 0 var(--line);border:1px solid var(--line);position:relative;overflow:hidden}
.heads::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--alert)}
.heads h2{font:600 1.15rem/1.1 Fredoka,sans-serif;margin:0 0 8px;color:var(--alert);display:flex;align-items:center;gap:8px}
.heads ul{margin:0;padding:0;list-style:none}
.heads li{display:flex;gap:8px;align-items:center;padding:4px 0}
.heads .dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.heads .when{margin-left:auto;font-size:.8rem;font-weight:800;color:var(--alert);background:var(--alert-tint);border-radius:999px;padding:2px 9px;white-space:nowrap}

/* sections */
.sec{margin:22px 4px 10px;display:flex;align-items:center;gap:8px}
.sec h3{font:600 1.2rem/1 Fredoka,sans-serif;margin:0}
.sec .n{background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:.8rem;font-weight:800;border-radius:999px;padding:1px 9px}
.sec.over h3{color:var(--alert)}

/* subject icon */
.ico{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:var(--c);font:700 1.15rem/1 Fredoka,sans-serif;background:color-mix(in srgb,var(--c) 14%,white)}

/* homework cards */
.card{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:20px;margin-bottom:10px;padding:12px 10px 12px 12px;border:1px solid var(--line);box-shadow:0 2px 0 var(--line)}
.card .body{flex:1;min-width:0;padding:0;background:none;border:0;text-align:left;display:block}
.card .subj,.erow .subj{font-weight:800;font-size:.82rem;color:var(--c)}
.card .title,.erow .title{font-weight:700;font-size:1.05rem;margin-top:1px;overflow-wrap:anywhere;line-height:1.25}
.pill{display:inline-block;margin-top:6px;font-size:.8rem;font-weight:800;border-radius:999px;padding:2px 10px;background:var(--bg);color:var(--muted)}
.pill.urgent{background:var(--alert-tint);color:var(--alert)}
.pill.soon{background:var(--warn-tint);color:var(--warn)}
.chk{flex:none;width:44px;height:44px;display:grid;place-items:center;background:none;border:0;padding:0}
.chk span{width:28px;height:28px;border-radius:9px;border:2.5px solid #C9D0E0;display:grid;place-items:center;transition:background .15s,border-color .15s}
.chk[aria-pressed="true"] span{background:var(--c);border-color:var(--c)}
.chk[aria-pressed="true"] span::after{content:"";width:7px;height:13px;border:solid #fff;border-width:0 3px 3px 0;transform:translateY(-2px) rotate(45deg)}
.card.done .title{text-decoration:line-through;color:var(--muted)}
.card.done{opacity:.7;box-shadow:none}
.bell{flex:none;width:40px;height:40px;border-radius:12px;background:none;border:0;color:#9AA2BC;display:grid;place-items:center}
.bell:hover{background:var(--bg);color:var(--brand)}
.bell svg{width:20px;height:20px}
.bell.on{color:var(--brand)}
details.setup{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
details.setup summary{cursor:pointer;font-weight:800;color:var(--brand);list-style:none;padding:4px 0}
details.setup summary::-webkit-details-marker{display:none}
details.setup summary::before{content:"▸ "}
details.setup[open] summary::before{content:"▾ "}
.steps b{color:var(--ink)}

/* calendar tile */
.cal{flex:none;width:58px;border-radius:14px;overflow:hidden;background:var(--surface);border:1.5px solid color-mix(in srgb,var(--c) 30%,white);text-align:center}
.cal .m{background:var(--c);color:#fff;font:700 .72rem/1 Nunito,sans-serif;padding:5px 0 4px;letter-spacing:.04em}
.cal .d{font:700 1.6rem/1 Fredoka,sans-serif;padding:6px 0 2px;color:var(--ink)}
.cal .w{font-size:.68rem;font-weight:800;color:var(--muted);padding-bottom:5px}

/* exams */
.hero{position:relative;display:block;width:100%;text-align:left;border:0;border-radius:26px;padding:20px;margin-bottom:12px;color:#fff;
  background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 70%,#1B2340));box-shadow:0 10px 24px -10px color-mix(in srgb,var(--c) 70%,transparent);overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero .lbl{display:inline-block;background:rgba(255,255,255,.2);border-radius:999px;padding:3px 11px;font-weight:800;font-size:.8rem}
.hero .row{display:flex;align-items:flex-end;gap:14px;margin-top:12px;position:relative;z-index:1}
.hero .big{font:700 5rem/.85 Fredoka,sans-serif}
.hero .big.word{font-size:3.2rem;line-height:.95}
.hero .unit{font:600 1.3rem/1.1 Fredoka,sans-serif;padding-bottom:6px;opacity:.95}
.hero .what{font-weight:800;font-size:1.15rem;margin-top:14px;position:relative;z-index:1;overflow-wrap:anywhere}
.hero .on{opacity:.9;font-weight:600;font-size:.95rem;position:relative;z-index:1}
.erow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);box-shadow:0 2px 0 var(--line);border-radius:20px;margin-bottom:10px;padding:10px 10px 10px 10px}
.erow .body{flex:1;min-width:0;padding:0;background:none;border:0;text-align:left}
.erow .left{font-weight:800;color:var(--c);font-size:.85rem;margin-top:4px}
.erow.past{opacity:.55;box-shadow:none}

/* empty */
.empty{background:var(--surface);border:2px dashed #CBD2E3;border-radius:22px;padding:30px 20px;text-align:center;color:var(--muted)}
.empty .em{font-size:2.4rem;display:block;margin-bottom:6px}
.empty b{display:block;color:var(--ink);font:600 1.3rem/1.1 Fredoka,sans-serif;margin-bottom:4px}

/* buttons */
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px;background:var(--brand);color:#fff;font-weight:800;font-size:1.02rem;box-shadow:0 3px 0 #3A44B0}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #3A44B0}
.btn.ghost{background:var(--surface);color:var(--brand);border:2px solid var(--brand-tint);box-shadow:none}
.btn.danger{background:var(--alert-tint);color:var(--alert);box-shadow:none}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;padding:8px 4px;font-size:.92rem;font-weight:700}
details.donebox{margin-top:14px}
details.donebox summary{cursor:pointer;color:var(--muted);font-weight:800;padding:10px 4px;list-style:none}
details.donebox summary::-webkit-details-marker{display:none}
details.donebox summary::before{content:"▸ "}
details.donebox[open] summary::before{content:"▾ "}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:8px 10px env(safe-area-inset-bottom,0px);box-shadow:0 -6px 20px -14px rgba(27,35,64,.35)}
nav.tabs .in{max-width:640px;margin:0 auto 8px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
nav.tabs button{background:none;border:0;border-radius:16px;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:2px;color:#8A92AD;font-weight:800;font-size:.8rem;position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--brand);background:var(--brand-tint)}
.badge{position:absolute;top:4px;left:calc(50% + 8px);background:var(--alert);color:#fff;font-size:.7rem;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 5px;border:2px solid var(--surface)}
.fab{position:fixed;right:max(18px,calc(50% - 302px));bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:21;height:58px;padding:0 22px 0 18px;border-radius:20px;border:0;background:var(--brand);color:#fff;font-weight:800;font-size:1rem;box-shadow:0 10px 22px -8px rgba(79,91,213,.7);display:flex;align-items:center;gap:8px}
.fab b{font-size:1.7rem;line-height:1;font-weight:600}
.fab[hidden]{display:none}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(27,35,64,.4);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.scrim[hidden]{display:none}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .24s ease-out}
.sheet::before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
@keyframes up{from{transform:translateY(50px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h2{font:700 1.7rem/1 Fredoka,sans-serif;margin:0 0 14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:16px;padding:5px;margin-bottom:6px}
.seg button{border:0;background:none;padding:10px;border-radius:12px;font-weight:800;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--brand);box-shadow:0 2px 6px rgba(27,35,64,.1)}
.field{display:block;font-weight:800;margin:16px 0 8px;font-size:.95rem}
.subjects{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:520px){.subjects{grid-template-columns:repeat(3,1fr)}}
.sj{border:2px solid transparent;background:color-mix(in srgb,var(--c) 10%,white);border-radius:14px;padding:8px 10px 8px 8px;display:flex;align-items:center;gap:9px;text-align:left;font-weight:800;font-size:.92rem;color:var(--ink)}
.sj i{font-style:normal;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--surface);color:var(--c);font:700 .9rem/1 Fredoka,sans-serif;flex:none}
.sj[aria-pressed="true"]{background:var(--c);color:#fff;border-color:var(--c)}
.inp{width:100%;padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);font-size:1rem;font-weight:600}
input[type=date].inp{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;min-height:52px;text-align:left}
input[type=date].inp::-webkit-date-and-time-value{text-align:left}
.inp:focus{border-color:var(--brand);background:var(--surface);outline:none}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.quick button{border:0;background:var(--brand-tint);color:var(--brand);border-radius:999px;padding:6px 13px;font-size:.88rem;font-weight:800}
.actions{display:grid;gap:8px;margin-top:22px}
.err{color:var(--alert);font-size:.9rem;font-weight:700;min-height:1.2em;margin-top:6px}

/* shahaf tab */
.panel{background:var(--surface);border:1px solid var(--line);box-shadow:0 2px 0 var(--line);border-radius:24px;padding:20px;margin-bottom:14px}
.panel h2{font:700 1.4rem/1.1 Fredoka,sans-serif;margin:0 0 8px}
.panel p{margin:0 0 10px;max-width:60ch;color:#3F4766}
.steps{margin:10px 0 16px;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:10px;align-items:flex-start;margin:8px 0;font-weight:600}
.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--brand-tint);color:var(--brand);display:grid;place-items:center;font:700 .85rem/1 Fredoka,sans-serif}
.status{color:var(--muted);margin-top:10px;min-height:1.3em;font-weight:600}
.found{display:flex;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.found:first-child{border-top:0}
.found input[type=checkbox]{width:22px;height:22px;accent-color:var(--brand);flex:none}
.found .meta{flex:1;min-width:0}
.found select{padding:6px 8px;border-radius:10px;border:2px solid var(--line);background:var(--bg);font-weight:700;max-width:100% }
.found .orig{color:var(--muted);font-size:.85rem;unicode-bidi:plaintext}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(170px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;z-index:40;font-weight:700;max-width:90vw}
.toast[hidden]{display:none}
[hidden]{display:none !important}
/* ---------- motion & celebrations ---------- */
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{width:46px;height:46px;flex:none;filter:drop-shadow(0 4px 8px rgba(79,91,213,.3))}
#view.enter{animation:enter .26s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(8px)}}
.card.fresh,.erow.fresh,.hero.fresh{animation:fresh .75s cubic-bezier(.2,1.4,.4,1)}
@keyframes fresh{0%{opacity:0;transform:translateY(-14px) scale(.94)}60%{opacity:1}100%{transform:none}}
.card.completing{animation:complete .55s ease forwards;pointer-events:none}
@keyframes complete{0%{transform:none}30%{transform:scale(1.03);background:color-mix(in srgb,var(--c) 16%,white)}100%{transform:translateX(40px) scale(.96);opacity:0;background:color-mix(in srgb,var(--c) 16%,white)}}
.card.completing .chk span{background:var(--c);border-color:var(--c);animation:chkpop .45s cubic-bezier(.2,1.8,.4,1)}
.card.completing .chk span::after{content:"";width:7px;height:13px;border:solid #fff;border-width:0 3px 3px 0;transform:translateY(-2px) rotate(45deg)}
@keyframes chkpop{0%{transform:scale(.5)}100%{transform:scale(1)}}
.fab:active{transform:scale(.94)}
.fab{transition:transform .15s}
.scrim{animation:fadein .2s ease-out;transition:opacity .22s}
.scrim.closing{opacity:0}
.sheet{transition:transform .26s cubic-bezier(.3,.9,.3,1);touch-action:pan-y}
.sheet.dragging{transition:none}
.scrim.closing .sheet{transform:translateY(105%) !important}
@keyframes fadein{from{opacity:0}}
html.locked,html.locked body{overflow:hidden}
.cheer{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;background:rgba(27,35,64,.38);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fadein .2s}
.cheer[hidden]{display:none}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:53}
.cheer-card{position:relative;z-index:52;width:100%;max-width:340px;background:#fff;border-radius:30px;padding:76px 22px 20px;text-align:center;box-shadow:0 24px 60px -12px rgba(27,35,64,.45);margin-top:60px}
.cheer.go .cheer-card{animation:pop .6s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{0%{transform:scale(.4) translateY(40px);opacity:0}100%{transform:none;opacity:1}}
.burst{position:absolute;left:50%;top:-62px;width:124px;height:124px;margin-left:-62px;border-radius:50%;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 70%,#1B2340));display:grid;place-items:center;font-size:3.6rem;box-shadow:0 0 0 8px #fff,0 14px 30px -8px var(--c)}
.burst::before,.burst::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--c);animation:ring 1.8s ease-out infinite}
.burst::after{animation-delay:.6s}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.9);opacity:0}}
.burst span{display:block;animation:bob 1.6s ease-in-out infinite}
.cheer.go .burst span{animation:spinin .7s cubic-bezier(.2,1.6,.4,1),bob 1.6s ease-in-out .7s infinite}
@keyframes spinin{0%{transform:scale(0) rotate(-200deg)}100%{transform:none}}
@keyframes bob{50%{transform:translateY(-7px) rotate(6deg)}}
.cheer h2{font:700 1.7rem/1.1 Fredoka,Nunito,sans-serif;margin:4px 0 6px;color:var(--ink)}
.cheer p{margin:0 0 16px;color:var(--muted);font-weight:600}
.prog{background:var(--bg);border-radius:999px;height:14px;overflow:hidden;margin:0 6px 6px}
.prog i{display:block;height:100%;width:var(--from);background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 60%,#fff));border-radius:999px;transition:width .9s cubic-bezier(.3,1.2,.4,1) .35s}
.cheer.go .prog i{width:var(--to)}
.progtxt{font-size:.85rem;font-weight:800;color:var(--c);margin-bottom:18px}
.cheer .btn{background:var(--c);box-shadow:0 3px 0 color-mix(in srgb,var(--c) 70%,#1B2340)}
@media (prefers-reduced-motion:reduce){
  #view.enter,.card.fresh,.erow.fresh,.hero.fresh,.cheer.go .cheer-card,.burst::before,.burst::after,.burst span,.cheer.go .burst span{animation:none}
  .card.completing{animation:none;opacity:.4}
  .prog i{transition:none}
}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><linearGradient id="lgbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6672F0"/><stop offset="1" stop-color="#3B45BF"/></linearGradient><linearGradient id="lgpg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EEF1FC"/></linearGradient></defs><rect width="512" height="512" rx="116" fill="url(#lgbg)"/><circle cx="430" cy="80" r="150" fill="#fff" opacity=".07"/><g transform="rotate(-6 256 276)"><rect x="140" y="128" width="236" height="290" rx="34" fill="#2D3596" opacity=".35" transform="translate(10 14)"/><rect x="140" y="128" width="236" height="290" rx="34" fill="url(#lgpg)"/><rect x="140" y="128" width="40" height="290" rx="20" fill="#DDE2F8"/><rect x="160" y="128" width="20" height="290" fill="#DDE2F8"/><g fill="#C9D0EE"><rect x="206" y="186" width="130" height="14" rx="7"/><rect x="206" y="222" width="96" height="14" rx="7"/></g><path d="M214 312 l40 40 l78 -92" fill="none" stroke="#2FB06E" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M388 118 q8 34 42 42 q-34 8 -42 42 q-8 -34 -42 -42 q34 -8 42 -42z" fill="#FFC23D"/><circle cx="110" cy="150" r="12" fill="#FFC23D" opacity=".9"/></svg><h1 id="viewTitle">Homework</h1></div>
    <div class="today"><div id="todayLbl"></div><div class="sync" id="syncLbl"></div></div>
  </header>
  <div id="headsUp"></div>
  <main id="view"></main>
</div>

<button class="fab" id="fab"><b>+</b><span id="fabLbl">Add homework</span></button>

<nav class="tabs" aria-label="Sections"><div class="in">
  <button data-tab="homework" aria-current="page">

    <div class="prog" id="cheerProg"><i></i></div>

    <button class="btn" id="cheerBtn">Let’s go</button>
  </div>
</div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
const SUBJECTS = [
  {k:"english",n:"English",he:"אנגלית",i:"Aa"},
  {k:"hebrew",n:"Hebrew",he:"עברית",i:"אב"},
  {k:"math",n:"Math",he:"מתמטיקה",i:"π"},
  {k:"cinema",n:"Cinema",he:"קולנוע",i:"🎬"},
  {k:"cs",n:"Computer Science",he:"מדעי המחשב",i:"</>"},
  {k:"history",n:"History",he:"היסטוריה",i:"🏛️"},
  {k:"civics",n:"Civics",he:"אזרחות",i:"⚖️"},
  {k:"literature",n:"Literature",he:"ספרות",i:"📖"},
  {k:"bible",n:"Bible",he:"תנ״ך",i:"📜"},
  {k:"sustainability",n:"Sustainability",he:"קיימות",i:"🌱"},
];
const LIGHT = new Set(["math"]);
const SUB = Object.fromEntries(SUBJECTS.map(s=>[s.k,s]));
const LS_KEY = "school-planner-v1";

let items = [];
let tab = "homework";
let freshId = null;

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const startToday = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const daysTo = s => Math.round((parse(s) - startToday()) / 86400000);
const addDays = n => { const d = startToday(); d.setDate(d.getDate()+n); return ymd(d); };
const fmtDate = s => parse(s).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
function rel(s){
  const d = daysTo(s);
  if (d < -1) return `Overdue by ${-d} days`;
  if (d === -1) return "Was due yesterday";
  if (d === 0) return "Today";
  if (d === 1) return "Tomorrow";
  return `In ${d} days`;
}
function weeksLbl(d){
  if (d < 14) return "";
  const w = Math.floor(d/7), r = d%7;
  return `${w} weeks${r ? `, ${r} day${r>1?"s":""}` : ""}`;
}

/* ---------- storage + GitHub sync ---------- */
// Everything is saved to school.json in your private gym_data repository.
const GH_OWNER = "manstar15";
const GH_REPO  = "gym_data";
const GH_FILE  = "school.json";
const KEY_LS   = "school.ghkey";
const API = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_FILE}`;
const lsGet = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch(e){} };
let token = lsGet(KEY_LS), sha = null, pushTimer = null, keyBroken = false;
let chain = Promise.resolve();
const queue = f => (chain = chain.then(f).catch(() => {}));
const live = () => items.filter(i => !i.deleted);
const stamp = it => it.u || it.created || 0;
const enc = str => { const b = new TextEncoder().encode(str); let s = ""; b.forEach(c => s += String.fromCharCode(c)); return btoa(s); };
const dec = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\n/g,"")), c => c.charCodeAt(0)));
const sig = list => JSON.stringify([...list].sort((a,b) => a.id < b.id ? -1 : 1));

function loadLocal(){
  try { const v = JSON.parse(lsGet(LS_KEY)); if (v && Array.isArray(v.items)) items = v.items; } catch(e){}
}
function saveLocal(){ lsSet(LS_KEY, JSON.stringify({items})); }
function setSync(t){ document.getElementById("syncLbl").textContent = t; }
function setSaved(){ keyBroken = false; setSync("Saved " + new Date().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"})); }
function merge(a, b){
  const m = new Map();
  for (const x of [...a, ...b]){ const o = m.get(x.id); if (!o || stamp(x) > stamp(o)) m.set(x.id, x); }
  return [...m.values()];
}
function gh(method, body, url = API){
  return fetch(url, {
    method, cache: "no-store",
    headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json", ...(body ? {"Content-Type":"application/json"} : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
}
function badKey(){ keyBroken = true; setSync("GitHub key stopped working"); if (tab === "shahaf") render(); }

async function pull(){
  if (!token) return;
  setSync("Syncing…");
  try {
    const r = await gh("GET");
    if (r.status === 404){ sha = null; return push(); }
    if (r.status === 401 || r.status === 403) return badKey();
    if (!r.ok) throw 0;
    const j = await r.json(); sha = j.sha;
    const remote = (JSON.parse(dec(j.content)).items) || [];
    items = merge(items, remote); saveLocal(); render();
    if (sig(items) !== sig(remote)) return push(); else setSaved();
  } catch(e){ setSync("Offline. Saved on this device"); }
}
async function push(retry = true){
  if (!token) return;
  const body = { message: "Update school planner", content: enc(JSON.stringify({items}, null, 1)) };
  if (sha) body.sha = sha;
  const r = await gh("PUT", body).catch(() => null);
  if (r && r.ok){ sha = (await r.json()).content.sha; setSaved(); return; }
  if (r && (r.status === 401 || r.status === 403)) return badKey();
  if (r && (r.status === 409 || r.status === 422) && retry){
    // another device saved first: combine both, then save again
    const g = await gh("GET").catch(() => null);
    if (g && g.ok){ const j = await g.json(); sha = j.sha; items = merge(items, JSON.parse(dec(j.content)).items || []); saveLocal(); render(); return push(false); }
  }
  setSync("Couldn’t save to GitHub. Saved on this device");
}
function persist(){
  saveLocal();
  if (!token) return;
  setSync("Saving…");
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => queue(() => push()), 700);
}
async function connect(key){
  const msg = document.getElementById("keyMsg");
  key = key.trim();
  if (!key){ msg.textContent = "Paste your GitHub key first."; return; }
  msg.textContent = "Checking your key…";
  token = key;
  const r = await gh("GET", null, `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}`).catch(() => null);
  if (!r || !r.ok){ token = lsGet(KEY_LS); msg.textContent = "That key didn’t work with gym_data. Copy it again from GitHub."; return; }
  lsSet(KEY_LS, key); keyBroken = false;
  msg.textContent = "";
  queue(pull).then(render);
  toast("Connected to GitHub");
}
function initSync(){
  if (token) queue(pull); else setSync("Saved on this device");
  document.addEventListener("visibilitychange", () => { if (!document.hidden && token) queue(pull); });
}

/* ---------- render ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const col = k => `var(--${SUB[k] ? k : "civics"})`;
const bellOnSvg = `<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" fill="none"/></svg>`;
const bellSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>`;

function hwCard(it){
  const d = daysTo(it.date);
  const cls = it.done ? "" : d <= 1 ? "urgent" : d <= 3 ? "soon" : "";
  return `<div class="card ${it.done?"done":""}${it.id===freshId?" fresh":""}" style="--c:${col(it.subject)}">
    <div class="ico">${esc(SUB[it.subject]?.i || "•")}</div>
    <button class="body" data-edit="${it.id}">
      <div class="subj">${esc(SUB[it.subject]?.n || "Other")}</div>
      <div class="title">${esc(it.title)}</div>
      <span class="pill ${cls}">${rel(it.date)}, ${fmtDate(it.date)}</span>
    </button>
    ${it.done ? "" : `<button class="bell${it.rem?" on":""}" data-cal="${it.id}" aria-label="${it.rem?"Reminders added. Tap to add again":"Add to Reminders"}">${it.rem?bellOnSvg:bellSvg}</button>`}
    <button class="chk" data-done="${it.id}" aria-pressed="${!!it.done}" aria-label="Mark ${esc(it.title)} as done"><span></span></button>
  </div>`;
}

function renderHomework(){
  const hw = live().filter(i => i.kind === "hw");
  const open = hw.filter(i => !i.done).sort((a,b) => a.date.localeCompare(b.date));
  const done = hw.filter(i => i.done).sort((a,b) => b.date.localeCompare(a.date));
  if (!hw.length) return `<div class="empty"><span class="em">📚</span><b>No homework yet</b>Tap + to add your first assignment.</div>`;
  const groups = [
    ["Overdue", open.filter(i => daysTo(i.date) < 0), "over"],
    ["Today and tomorrow", open.filter(i => { const d = daysTo(i.date); return d >= 0 && d <= 1; })],
    ["This week", open.filter(i => { const d = daysTo(i.date); return d >= 2 && d <= 7; })],
    ["Later", open.filter(i => daysTo(i.date) > 7)],
  ];
  let h = "";
  if (!open.length) h += `<div class="empty"><span class="em">🎉</span><b>All done</b>Nothing left to hand in.</div>`;
  for (const [name, list, cls] of groups){
    if (!list.length) continue;
    h += `<div class="sec ${cls||""}"><h3>${name}</h3><span class="n">${list.length}</span></div>` + list.map(hwCard).join("");
  }
  if (done.length) h += `<details class="donebox"><summary>Done (${done.length})</summary>${done.map(hwCard).join("")}<button class="linkbtn" id="clearDone">Clear done homework</button></details>`;
  return h;
}

function countFor(d){
  if (d === 0) return ["Today",""];
  if (d === 1) return ["Tomorrow",""];
  return [String(d), "days"];
}
function renderExams(){
  const ex = live().filter(i => i.kind === "exam").sort((a,b) => a.date.localeCompare(b.date));
  const up = ex.filter(i => daysTo(i.date) >= 0);
  const past = ex.filter(i => daysTo(i.date) < 0).reverse();
  if (!ex.length) return `<div class="empty"><span class="em">📝</span><b>No exams yet</b>Tap + to add one, or bring them in from Shahaf.</div>
    <div style="margin-top:12px"><button class="btn ghost" data-go="shahaf">Import from Shahaf</button></div>`;
  let h = "";
  if (up.length){
    const n = up[0], d = daysTo(n.date), [big, unit] = countFor(d);
    h += `<button class="hero${n.id===freshId?" fresh":""}" style="--c:${col(n.subject)}" data-edit="${n.id}">
      <span class="lbl">Next exam</span>
      <div class="row"><div class="big ${unit?"":"word"}">${big}</div>${unit ? `<div class="unit">${d===1?"day":"days"}<br>to go</div>` : ""}</div>
      <div class="what">${esc(SUB[n.subject]?.i || "")} ${esc(SUB[n.subject]?.n || "Exam")}: ${esc(n.title)}</div>
      <div class="on">${parse(n.date).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"})}${weeksLbl(d) ? ", " + weeksLbl(d) : ""}</div>
    </button>`;
    const rest = up.slice(1);
    if (rest.length) h += `<div class="sec"><h3>Coming up</h3><span class="n">${rest.length}</span></div>` + rest.map(examRow).join("");
  } else {
    h += `<div class="empty"><span class="em">😌</span><b>No upcoming exams</b>Enjoy it.</div>`;
  }
  if (past.length) h += `<details class="donebox"><summary>Past exams (${past.length})</summary>${past.map(examRow).join("")}</details>`;
  return h;
}
function examRow(it){
  const d = daysTo(it.date), past = d < 0, dt = parse(it.date);
  const left = past ? "Done" : d === 0 ? "Today!" : d === 1 ? "Tomorrow!" : `In ${d} days${weeksLbl(d) ? " (" + weeksLbl(d) + ")" : ""}`;
  return `<div class="erow ${past?"past":""}${it.id===freshId?" fresh":""}" style="--c:${col(it.subject)}">
    <div class="cal"><div class="m">${dt.toLocaleDateString("en-GB",{month:"short"}).toUpperCase()}</div><div class="d">${dt.getDate()}</div><div class="w">${dt.toLocaleDateString("en-GB",{weekday:"short"})}</div></div>
    <button class="body" data-edit="${it.id}">
      <div class="subj">${esc(SUB[it.subject]?.n || "Exam")}</div>
      <div class="title">${esc(it.title)}</div>
      <div class="left">${left}</div>
    </button>
    ${past ? "" : `<button class="bell${it.rem?" on":""}" data-cal="${it.id}" aria-label="${it.rem?"Reminders added. Tap to add again":"Add to Reminders"}">${it.rem?bellOnSvg:bellSvg}</button>`}
  </div>`;
}

let imported = [];
function renderShahaf(){
  let h = `<section class="panel">
    <h2>☁️ Sync</h2>`;
  if (token && !keyBroken){
    h += `<p>Your homework and exams save to <b>school.json</b> in your private gym_data repository, so every device you connect shows the same list.</p>
      <button class="btn ghost" id="syncNow">Sync now</button>
      <button class="linkbtn" id="disconnect">Disconnect this device</button>`;
  } else {
    h += `<p>${keyBroken ? "Your GitHub key stopped working. Paste a new one to keep syncing." : "Paste your GitHub key once on each device to keep everything in sync. It’s the same key you use for the gym log."}</p>
      <input class="inp" id="keyIn" type="password" autocomplete="off" placeholder="github_pat_…" aria-label="GitHub key">
      <div style="height:10px"></div>
      <button class="btn" id="keyBtn">Connect</button>
      <div class="err" id="keyMsg" role="status"></div>`;
  }
  h += `</section>
  <section class="panel">
    <h2>📲 Bring in your exams from Shahaf</h2>
    <p>Shahaf doesn’t let other apps read your timetable, so here’s the quickest way:</p>
    <ol class="steps">
      <li>Screenshot your exams list (מבחנים) in Shahaf.</li>
      <li>Send it to Claude and ask for an exam code for your school planner.</li>
      <li>Paste the code here.</li>
    </ol>
    <textarea class="inp" id="pasteIn" rows="3" placeholder='{"exams":[…]}' aria-label="Exam code from Claude" style="resize:vertical;font-size:.9rem"></textarea>
    <div style="height:10px"></div>
    <button class="btn" id="pasteBtn">Read code</button>
    <div class="status" id="shotStatus" role="status"></div>
  </section>`;
  if (imported.length){
    h += `<section class="panel"><h2>Found ${imported.length} exam${imported.length>1?"s":""}</h2>
      <p>Untick anything that’s wrong, and fix the subject if needed.</p>
      <div id="foundList">${imported.map((e,i) => `
        <div class="found">
          <input type="checkbox" data-imp="${i}" ${e.keep?"checked":""} aria-label="Add this exam">
          <div class="meta">
            <select data-impsub="${i}" aria-label="Subject">
              ${SUBJECTS.map(s => `<option value="${s.k}" ${s.k===e.subject?"selected":""}>${s.n}</option>`).join("")}
            </select>
            <div style="font-weight:600;margin-top:4px">${esc(e.title)} · ${e.date ? fmtDate(e.date) : "no date"}</div>
            ${e.original ? `<div class="orig">${esc(e.original)}</div>` : ""}
            ${e.dup ? `<div class="orig" style="direction:ltr">Already in your exams</div>` : ""}
          </div>
        </div>`).join("")}</div>
      <div class="actions"><button class="btn" id="impAdd">Add selected exams</button><button class="btn ghost" id="impClear">Discard</button></div>
    </section>`;
  }
  h += `<section class="panel">
    <h2>🔔 Reminders</h2>
    <p>Tap the bell on any homework or exam and it goes straight into your iPhone’s Reminders app, with alerts at 13:00 two days before (three for exams), 13:00 the day before, and 23:00 the night before.</p>
    <button class="btn" id="calAll">Add all upcoming to Reminders</button>
    <details class="setup" ${lsGet("school.shortcutOk") ? "" : "open"}>
      <summary>One-time setup (2 minutes)</summary>
      <p>Websites can’t make reminders on iPhone by themselves, so a small shortcut does it for them. Build it once in the <b>Shortcuts</b> app:</p>
      <ol class="steps">
        <li>Tap <b>+</b> to make a new shortcut and name it exactly <b>School Reminders</b>.</li>
        <li>Add <b>Split Text</b>. Tap the blue text and pick <b>Shortcut Input</b>. Set it to split by <b>New Lines</b>.</li>
        <li>Add <b>Repeat with Each</b>. It uses Split Text automatically.</li>
        <li>Inside the repeat, add <b>Split Text</b> again with <b>Repeat Item</b>, split by <b>Custom</b> and type <b>|</b> (the straight line).</li>
        <li>Add <b>Get Item from List</b> set to <b>First Item</b>, then <b>Set Variable</b> named <b>Title</b>.</li>
        <li>Add <b>Get Item from List</b> again, tap its list and pick the second <b>Split Text</b>, set it to <b>Last Item</b>, then <b>Set Variable</b> named <b>When</b>.</li>
        <li>Add <b>Add New Reminder</b>. Tap <b>Reminder</b> and pick the variable <b>Title</b>. Tap the arrow, turn on <b>Remind Me</b>, and set the date to the variable <b>When</b>.</li>
        <li>Tap <b>Done</b>. Then come back here and tap <b>Test it</b>.</li>
      </ol>
      <button class="btn ghost" id="remTest">Test it</button>
      <p class="status">The test makes one reminder for 5 minutes from now. If it shows up in Reminders, you’re set, and you can delete it.</p>
    </details>
  </section>`;
  return h;
}

function renderHeads(){
  const soon = live().filter(i => !i.done && (() => { const d = daysTo(i.date); return d >= 0 && d <= 1; })())
    .sort((a,b) => a.date.localeCompare(b.date));
  const el = document.getElementById("headsUp");
  if (!soon.length || tab === "shahaf"){ el.innerHTML = ""; return; }
  el.innerHTML = `<div class="heads"><h2>🔔 Heads up</h2><ul>${soon.map(i => `
    <li style="--c:${col(i.subject)}"><span class="dot"></span><span><b>${esc(SUB[i.subject]?.n || "")}</b> ${i.kind === "exam" ? "exam" : "homework"}: ${esc(i.title)}</span><span class="when">${daysTo(i.date)===0?"Today":"Tomorrow"}</span></li>`).join("")}</ul></div>`;
}

function renderBadges(){
  const urgent = k => live().filter(i => i.kind === k && !i.done && daysTo(i.date) <= 1 && daysTo(i.date) >= (k === "exam" ? 0 : -999)).length;
  for (const [id, k] of [["hwBadge","hw"],["exBadge","exam"]]){
    const n = urgent(k), el = document.getElementById(id);
    el.hidden = !n; el.textContent = n;
  }
}

function render(){
  document.getElementById("viewTitle").textContent = {homework:"Homework", exams:"Exams", shahaf:"Shahaf"}[tab];
  document.querySelectorAll("nav.tabs button").forEach(b => { if (b.dataset.tab === tab) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  document.getElementById("fab").hidden = tab === "shahaf";
  document.getElementById("fabLbl").textContent = tab === "exams" ? "Add exam" : "Add homework";
  const v = document.getElementById("view");
  v.innerHTML = tab === "homework" ? renderHomework() : tab === "exams" ? renderExams() : renderShahaf();
  renderHeads(); renderBadges();
  if (freshId) setTimeout(() => { freshId = null; }, 50);
}

/* ---------- interactions ---------- */
document.querySelector("nav.tabs").addEventListener("click", e => {
  const b = e.target.closest("[data-tab]"); if (!b) return;
  go(b.dataset.tab);
});
function go(t){
  const changed = t !== tab;
  tab = t; history.replaceState(null, "", "#" + t); render(); window.scrollTo(0,0);
  if (changed){ const v = document.getElementById("view"); v.classList.remove("enter"); void v.offsetWidth; v.classList.add("enter"); if (t === "exams") countUpHero(); }
}

document.getElementById("view").addEventListener("click", e => {
  const t = e.target;
  const done = t.closest("[data-done]");
  if (done){
    const id = done.dataset.done, it = items.find(i => i.id === id); if (!it) return;
    if (!it.done) completeHomework(id, done.closest(".card"));
    else { items = items.map(i => i.id === id ? {...i, done:false, u:Date.now()} : i); persist(); render(); toast("Moved back to your list"); }
    return; }
  const ed = t.closest("[data-edit]");
  if (ed){ openSheet(items.find(i => i.id === ed.dataset.edit)); return; }
  const cal = t.closest("[data-cal]");
  if (cal){ const it = items.find(i => i.id === cal.dataset.cal); if (it) sendReminders([it]); return; }
  const g = t.closest("[data-go]");
  if (g){ go(g.dataset.go); return; }
  if (t.id === "clearDone"){ items = items.map(i => (i.kind === "hw" && i.done && !i.deleted) ? {...i, deleted:true, u:Date.now()} : i); persist(); render(); toast("Cleared"); return; }
  if (t.id === "calAll"){
    const up = live().filter(i => !i.done && daysTo(i.date) >= 0);
    if (!up.length) { toast("Nothing upcoming to add"); return; }
    sendReminders(up); return;
  }
  if (t.id === "impAdd"){ addImported(); return; }
  if (t.id === "pasteBtn"){ readPaste(); return; }
  if (t.id === "remTest"){ const d = new Date(Date.now() + 5*60000); lsSet("school.shortcutOk", "1"); runShortcut(`✅ School log test|${ymd(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`); return; }
  if (t.id === "keyBtn"){ connect(document.getElementById("keyIn").value); return; }
  if (t.id === "syncNow"){ queue(pull); return; }
  if (t.id === "disconnect"){ lsSet(KEY_LS, null); token = null; sha = null; setSync("Saved on this device"); render(); toast("Disconnected. Your list stays on this device."); return; }
  if (t.id === "impClear"){ imported = []; render(); return; }
});

  if (t.dataset.imp !== undefined) imported[+t.dataset.imp].keep = t.checked;

});

/* ---------- iPhone Reminders via the "School Reminders" shortcut ---------- */
const SHORTCUT = "School Reminders";
function remLines(it){
  const exam = it.kind === "exam";
  const subj = SUB[it.subject]?.n || "School";
  const extra = it.title && !/^(homework|exam)$/i.test(it.title) ? ` (${it.title})` : "";
  const name = (exam ? `📝 ${subj} exam${extra}` : `📚 ${subj} homework${extra}`).replace(/[|\n]/g, " ");
  const plan = exam ? [[3,13,"in 3 days"],[1,13,"tomorrow"],[1,23,"tomorrow"]] : [[2,13,"due in 2 days"],[1,13,"due tomorrow"],[1,23,"due tomorrow"]];
  const out = [];
  for (const [days, hour, when] of plan){
    const d = parse(it.date); d.setDate(d.getDate() - days); d.setHours(hour, 0, 0, 0);
    if (d <= new Date()) continue;
    out.push(`${name}, ${when}|${ymd(d)} ${pad(hour)}:00`);
  }
  return out;
}
function runShortcut(text){
  location.href = `shortcuts://run-shortcut?name=${encodeURIComponent(SHORTCUT)}&input=text&text=${encodeURIComponent(text)}`;
}
function sendReminders(list){
  const lines = list.flatMap(remLines);
  if (!lines.length){ toast("All the alert times for this have already passed"); return; }
  const ids = new Set(list.map(i => i.id));
  items = items.map(i => ids.has(i.id) ? {...i, rem: true, u: Date.now()} : i);
  persist(); render();
  runShortcut(lines.join("\n"));
  toast(`Sending ${lines.length} reminder${lines.length > 1 ? "s" : ""} to the Reminders app…`, 3500);
}

/* ---------- calendar reminders (.ics) ---------- */
function icsEsc(s){ return String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n"); }
function buildIcs(list){
  const stamp = new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+Z$/,"Z");
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//School planner//EN","CALSCALE:GREGORIAN"];
  const alarm = (trigger, text) => ["BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${icsEsc(text)}`,`TRIGGER:${trigger}`,"END:VALARM"];
  for (const it of list){
    const exam = it.kind === "exam";
    const s = it.date.replace(/-/g,"");
    const e = new Date(parse(it.date)); e.setDate(e.getDate()+1);
    const before = new Date(parse(it.date)); before.setDate(before.getDate()-1);
    const b = ymd(before).replace(/-/g,"");
    const what = `${SUB[it.subject]?.n || ""} – ${it.title}`;
    const label = `${exam ? "Exam" : "Homework"}: ${what}`;
    // the day itself, with alerts at 13:00: homework 2 days before, exams 3 days before, and both 1 day before
    L.push("BEGIN:VEVENT", `UID:${it.id}@school-planner`, `DTSTAMP:${stamp}`,
      `DTSTART;VALUE=DATE:${s}`, `DTEND;VALUE=DATE:${ymd(e).replace(/-/g,"")}`,
      `SUMMARY:${icsEsc(label)}`, "TRANSP:TRANSPARENT",
      ...alarm(exam ? "-P2DT11H" : "-P1DT11H", exam ? `Exam in 3 days: ${what}` : `Due in 2 days: ${what}`),
      ...alarm("-PT11H", exam ? `Exam tomorrow: ${what}` : `Due tomorrow: ${what}`),
      "END:VEVENT");
    // a short reminder at 23:00 the night before
    L.push("BEGIN:VEVENT", `UID:${it.id}-night@school-planner`, `DTSTAMP:${stamp}`,
      `DTSTART:${b}T230000`, `DTEND:${b}T231500`,
      `SUMMARY:${icsEsc((exam ? "Exam tomorrow: " : "Due tomorrow: ") + what)}`, "TRANSP:TRANSPARENT",
      ...alarm("PT0M", (exam ? "Exam tomorrow: " : "Due tomorrow: ") + what),
      "END:VEVENT");
  }
  L.push("END:VCALENDAR");
  return L.join("\r\n");
}
function saveIcs(list, filename){
  const a = document.createElement("a");
  a.href = "data:text/calendar;charset=utf-8," + encodeURIComponent(buildIcs(list));
  a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  toast("Saved to your Downloads. Open the Files app → Downloads, tap the file, then tap Add All.", 6000);
}

function readPaste(){
  const box = document.getElementById("pasteIn"), status = document.getElementById("shotStatus");
  let v;
  try { v = JSON.parse(box.value.trim().replace(/^```(json)?|```$/g, "")); }
  catch(e){ status.textContent = "That doesn’t look like a code from Claude. Copy the whole thing and try again."; return; }
  const list = Array.isArray(v) ? v : (v.exams || v.items || []);

    return {subject, title: String(x.title || "Exam").slice(0,120), date: x.date, original: "", keep: !dup && daysTo(x.date) >= 0, dup};
  });
  status.textContent = imported.length ? "" : "No exams found in that code.";
  box.value = "";
  render();
}
function addImported(){

let toastT;
function toast(t, ms = 2200){ const el = document.getElementById("toast"); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, ms); }

/* ---------- celebrations ---------- */
const HW_CHEERS = [["✅","Done and dusted"],["🚀","One less thing"],["🧠","Big brain move"],["⚡","Knocked it out"],["🎯","Nailed it"],["🔥","You’re on a roll"],["😎","Easy work"],["💪","Handled it"]];
const ALL_CHEERS = [["🏆","Homework cleared!"],["🎉","Nothing left to do!"],["👑","Zero homework. Legend."]];
const IMPORT_CHEERS = [["📲","Exams are in"],["🗓️","Schedule sorted"]];
const lastCheer = {};
function pickCheer(list, key){
  let i; do { i = Math.floor(Math.random() * list.length); } while (list.length > 1 && i === lastCheer[key]);
  lastCheer[key] = i; return list[i];
}
const reduceMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let confettiRun = 0;
function confetti(mainColor){
  if (reduceMotion()) return;
  const cv = document.getElementById("confetti"), ctx = cv.getContext("2d");
  const dpr = Math.min(window.devicePixelRatio || 1, 2), W = innerWidth, H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const css = getComputedStyle(document.documentElement);
  const cols = [mainColor, mainColor, ...["--brand","--math","--sustainability","--literature","--english"].map(v => css.getPropertyValue(v).trim())];
  const parts = [];
  const shoot = (x, y, angle, spread, n, speed) => {
    for (let i = 0; i < n; i++){
      const a = angle + (Math.random() - .5) * spread, v = speed * (.55 + Math.random() * .6);
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: Math.random() * 6.28, vr: (Math.random() - .5) * .35,
        w: 7 + Math.random() * 6, h: 4 + Math.random() * 5, c: cols[i % cols.length], wob: Math.random() * 6.28, vw: .08 + Math.random() * .12, round: Math.random() < .25 });
    }
  };
  const s = Math.min(W, H);
  shoot(-10, H * .78, -Math.PI / 3.2, .7, 60, s * .045);
  shoot(W + 10, H * .78, -Math.PI + Math.PI / 3.2, .7, 60, s * .045);
  shoot(W / 2, H * .36, -Math.PI / 2, 2.6, 45, s * .03);
  const id = ++confettiRun, start = performance.now();
  let last = start;
  (function frame(t){
    if (id !== confettiRun) return;
    const dt = Math.min(2, (t - last) / 16.67); last = t;
    ctx.clearRect(0, 0, W, H);
    let alive = 0;
    for (const p of parts){
      p.vy += .32 * dt; p.vx *= Math.pow(.985, dt); p.vy *= Math.pow(.985, dt);
      p.x += p.vx * dt + Math.sin(p.wob) * .6; p.y += p.vy * dt; p.r += p.vr * dt; p.wob += p.vw * dt;
      if (p.y > H + 30) continue;
      alive++;
      const fade = Math.max(0, Math.min(1, (4200 - (t - start)) / 900));
      ctx.save(); ctx.globalAlpha = fade; ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.scale(1, Math.cos(p.wob));
      ctx.fillStyle = p.c;
      if (p.round){ ctx.beginPath(); ctx.arc(0, 0, p.h * .7, 0, 6.28); ctx.fill(); } else ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
    if (alive && t - start < 4200) requestAnimationFrame(frame); else ctx.clearRect(0, 0, W, H);
  })(start);
}
function cheer({emoji, title, sub, subject, from, to, progLabel}){
  const el = document.getElementById("cheer");
  const varName = SUB[subject] ? `--${subject}` : "--brand";
  el.style.setProperty("--c", `var(${varName})`);
  document.getElementById("cheerEmoji").textContent = emoji;
  document.getElementById("cheerTitle").textContent = title;
  document.getElementById("cheerSub").textContent = sub;
  const prog = document.getElementById("cheerProg");
  if (to != null){
    prog.hidden = false;
    prog.querySelector("i").style.setProperty("--from", from + "%");
    prog.querySelector("i").style.setProperty("--to", to + "%");
    document.getElementById("cheerProgTxt").textContent = progLabel;
  } else prog.hidden = true;
  document.getElementById("cheerProgTxt").hidden = to == null;
  el.hidden = false;
  el.classList.remove("go"); void el.offsetWidth; el.classList.add("go");
  confetti(getComputedStyle(document.documentElement).getPropertyValue(varName).trim());
}
function closeCheer(){ document.getElementById("cheer").hidden = true; confettiRun++; const cv = document.getElementById("confetti"); cv.getContext("2d").clearRect(0,0,cv.width,cv.height); }
document.getElementById("cheer").addEventListener("click", closeCheer);
document.addEventListener("keydown", e => { if (e.key === "Escape" && !document.getElementById("cheer").hidden) closeCheer(); });
(() => { let y0 = null; const c = document.getElementById("cheer");
  c.addEventListener("touchstart", e => { y0 = e.touches[0].clientY; }, {passive:true});
  c.addEventListener("touchend", e => { if (y0 != null && Math.abs(e.changedTouches[0].clientY - y0) > 50) closeCheer(); y0 = null; });
})();

function hwStats(){
  const from = startToday(); from.setDate(from.getDate() - 7);
  const recent = live().filter(i => i.kind === "hw" && (!i.done || parse(i.date) >= from));
  return { done: recent.filter(i => i.done).length, total: recent.length, open: recent.filter(i => !i.done).length };
}
function completeHomework(id, cardEl){
  const it0 = items.find(i => i.id === id); if (!it0) return;
  const before = hwStats();
  const apply = () => {
    items = items.map(i => i.id === id ? {...i, done: true, u: Date.now()} : i);
    persist(); render();
    const after = hwStats(), it = items.find(i => i.id === id), d = daysTo(it.date);
    const subj = SUB[it.subject]?.n || "Homework";
    const early = d >= 2 ? ` Finished ${d} days early!` : d === 1 ? " Done a day early." : "";
    const all = after.open === 0;
    const [emoji, title] = all ? pickCheer(ALL_CHEERS, "all") : pickCheer(HW_CHEERS, "hw");
    const sub = all ? `Everything’s handed in.${early} Go enjoy your day.` : `${subj} done.${early} ${after.open} left to go.`;
    const pct = n => after.total ? Math.round(n / after.total * 100) : 100;
    cheer({emoji, title, sub, subject: it.subject, from: pct(before.done), to: pct(after.done), progLabel: `${after.done} of ${after.total} done this week`});
  };
  if (cardEl && !reduceMotion()){ cardEl.classList.add("completing"); setTimeout(apply, 480); }
  else apply();
}
function countUpHero(){
  if (reduceMotion()) return;
  const el = document.querySelector(".hero .big:not(.word)"); if (!el) return;
  const to = parseInt(el.textContent, 10); if (!(to > 1)) return;
  const t0 = performance.now(), ms = Math.min(900, 300 + to * 25);
  (function f(t){ const k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3); el.textContent = Math.round(to * e); if (k < 1) requestAnimationFrame(f); })(t0);
}

/* ---------- sheet: swipe down to close ---------- */
(() => {
  const sheet = document.querySelector("#scrim .sheet");
  let y0 = null, dy = 0, t0 = 0;
  sheet.addEventListener("touchstart", e => {
    if (e.target.closest("input,textarea,select")) return;
    if (sheet.scrollTop > 2) return;
    y0 = e.touches[0].clientY; dy = 0; t0 = Date.now();
  }, {passive:true});
  sheet.addEventListener("touchmove", e => {
    if (y0 == null) return;
    dy = Math.max(0, e.touches[0].clientY - y0);
    if (dy > 4){ sheet.classList.add("dragging"); if (e.cancelable) e.preventDefault(); sheet.style.transform = `translateY(${dy}px)`; }
  }, {passive:false});
  const end = () => {
    if (y0 == null) return;
    sheet.classList.remove("dragging");
    const v = dy / Math.max(1, Date.now() - t0);
    if (dy > 110 || (v > .5 && dy > 30)) closeSheet(); else sheet.style.transform = "";
    y0 = null; dy = 0;
  };
  sheet.addEventListener("touchend", end); sheet.addEventListener("touchcancel", end);
})();

loadLocal(); paintToday(); render();
initSync();
document.getElementById("syncLbl").addEventListener("click", () => go("shahaf"));
